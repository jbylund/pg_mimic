name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 3.15 isn't out yet (expected ~2026-10-01) -- add it once it's stable.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # -vvv names every test, --durations=0 reports every duration (not just the
      # slowest N) so a test that starts creeping is visible before it times out.
      - run: pytest -vvv --durations=0
