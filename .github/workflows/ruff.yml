name: Ruff

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv pip install --system ruff
      - run: ruff check .
      - run: ruff format --check .
