[project]
name = "pg-mimic"
version = "0.1.3"
description = "A pure-Python, asyncio PostgreSQL server protocol emulator — implement your own Postgres-compatible backend in Python."
readme = "README.md"
requires-python = ">=3.10"
# PEP 639 form: an SPDX expression plus the file to ship. The older
# `license = { text = "MIT" }` named a licence without shipping one, so neither
# the sdist nor the wheel carried the text and GitHub couldn't detect it.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "postgres",
    "postgresql",
    "wire-protocol",
    "asyncio",
    "database",
    "emulator",
    "mock",
    "testing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    # No "License :: OSI Approved :: ..." classifier on purpose: PEP 639 retired
    # those, and a build that declares a `license` expression *and* a licence
    # classifier is rejected rather than merely warned about. The expression above
    # is what PyPI renders now.
]
dependencies = [
    # 30.15.0 is where the executor stopped running a FULL OUTER JOIN as an inner
    # join; below it, TableSession would answer one with the wrong rows.
    "sqlglot>=30.17.0",
    "scramp>=1.4.5",
]

[project.optional-dependencies]
dev = [
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/jbylund/pg_mimic"
Repository = "https://github.com/jbylund/pg_mimic"
Issues = "https://github.com/jbylund/pg_mimic/issues"
Changelog = "https://github.com/jbylund/pg_mimic/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
# Makes pg_mimic's fixtures (pg_mimic_server, pg_mimic_dsn) available to any test
# suite that has pg-mimic installed, with no conftest plumbing. Only this module
# imports pytest; pg_mimic.testing works without it.
pg_mimic = "pg_mimic.pytest_plugin"

[build-system]
# 1.27 is where hatchling learned PEP 639: below it, `license = "MIT"` plus
# `license-files` is a metadata error rather than a licence.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# No file selection beyond this: hatchling ships every non-ignored file under
# pg_mimic/, which is how the zero-byte PEP 561 marker (pg_mimic/py.typed) gets
# into the wheel. Narrowing this to *.py would strip the marker, and a stripped
# marker fails silently -- the package still imports, it just reads as Any to a
# consumer's mypy. tests/test_packaging.py fails instead.
packages = ["pg_mimic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A misbehaving client can retry a query it can't parse forever (asyncpg does
# exactly that when a statement it depends on answers with the wrong shape).
# Without a per-test limit that hangs until CI's own timeout, which defaults to
# six hours -- fail the one test instead.
#
# The slowest test takes 0.30s in CI (a deliberate sleep, to have a query worth
# cancelling), and the slowest CPU-bound one 0.15s, so this is ~13x headroom. Kept
# tight on purpose: it also catches accidental slowness, which is not
# hypothetical here -- a teardown that hung for 5s per test and a cross-loop wait
# that idled for 2s both hid in a suite that had no limit at all.
timeout = 4

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E", "F", "I"]
