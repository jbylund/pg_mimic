[project]
name = "pg-mimic"
version = "0.1.0"
description = "A pure-Python, asyncio PostgreSQL server protocol emulator — implement your own Postgres-compatible backend in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=25.0.0",
    "scramp>=1.4.5",
]

[project.optional-dependencies]
dev = [
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_mimic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
