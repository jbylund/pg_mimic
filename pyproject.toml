[project]
name = "pg-mimic"
version = "0.1.2"
description = "A pure-Python, asyncio PostgreSQL server protocol emulator — implement your own Postgres-compatible backend in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=25.0.0",
    "scramp>=1.4.5",
]

[project.optional-dependencies]
dev = [
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_mimic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A misbehaving client can retry a query it can't parse forever (asyncpg does
# exactly that when a statement it depends on answers with the wrong shape).
# Without a per-test limit that hangs until CI's own timeout, which defaults to
# six hours -- fail the one test instead.
#
# The slowest test takes 0.30s in CI (a deliberate sleep, to have a query worth
# cancelling), and the slowest CPU-bound one 0.15s, so this is ~13x headroom. Kept
# tight on purpose: it also catches accidental slowness, which is not
# hypothetical here -- a teardown that hung for 5s per test and a cross-loop wait
# that idled for 2s both hid in a suite that had no limit at all.
timeout = 4

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E", "F", "I"]
