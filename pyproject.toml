[project]
name = "pg-mimic"
version = "0.1.1"
description = "A pure-Python, asyncio PostgreSQL server protocol emulator — implement your own Postgres-compatible backend in Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "sqlglot>=25.0.0",
    "scramp>=1.4.5",
]

[project.optional-dependencies]
dev = [
    "asyncpg>=0.30",
    "psycopg[binary]>=3.1",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.3",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pg_mimic"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# A misbehaving client can retry a query it can't parse forever (asyncpg does
# exactly that when a statement it depends on answers with the wrong shape).
# Without a per-test limit that hangs until CI's own timeout, which defaults to
# six hours -- fail the one test instead. The slowest test deliberately runs a
# ~2s query to have something to cancel, so this leaves ample headroom.
timeout = 10

[tool.ruff]
line-length = 132

[tool.ruff.lint]
select = ["E", "F", "I"]
